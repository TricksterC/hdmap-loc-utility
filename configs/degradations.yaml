seeds: [0, 1, 2]
radius: 50.0
drift:
  scale_error: 0.03
  yaw_bias: 0.003
  trans_noise: 0.02
  yaw_noise: 0.002
sweeps:
  lateral_shift: [0.0, 0.25, 0.5, 1.0, 2.0]        # m, ego +y (left)
  longitudinal_shift: [0.0, 0.25, 0.5, 1.0, 2.0]   # m, ego +x (forward)
  rotation_deg: [0.0, 0.5, 1.0, 2.0, 4.0]
  jitter_sigma: [0.0, 0.1, 0.25, 0.5, 1.0]         # m, per point
  element_dropout: [0.0, 0.2, 0.4, 0.6, 0.8]       # fraction of elements removed
  drop_transverse: [0, 1]                          # 1 = remove all crosswalks and stop lines
  false_dividers: [0, 2, 5, 10]                    # number of hallucinated segments
  false_stop_lines: [0, 2, 5, 10]
  range_m: [15, 30, 50]                            # perception range
  drop_dividers: [0, 1]                            # 1 = remove all lane dividers
  drop_all: [0, 1]                                 # 1 = empty map (no-map anchor)
  drift_scale_error: [0.0, 0.01, 0.03, 0.06]       # odometry, not the map
  drift_yaw_bias: [0.0, 0.003, 0.01]               # rad per step
